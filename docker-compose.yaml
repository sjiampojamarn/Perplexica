services:
  vane:
    image: itzcrazykns1337/vane:latest
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in your environment}
    volumes:
      - data:/home/vane/data
    restart: unless-stopped

volumes:
  data:
    name: 'vane-data'
